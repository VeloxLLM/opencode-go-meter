[package]
name = "opencode-go-tray"
version = "0.1.0"
edition = "2021"

[dependencies]
tray-icon = "0.26.1"
winit = "0.30"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
chrono = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Globalization",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
